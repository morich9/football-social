<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت | فوتبال سوشال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A1F16;
    --panel: #12291D;
    --panel-alt: #16331F;
    --line: #234631;
    --ink: #F1F3EA;
    --ink-dim: #8FA894;
    --gold: #F0B429;
    --red: #E8492C;
    --green-bright: #4ADE80;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: radial-gradient(circle at 50% -10%, #133525 0%, var(--bg) 55%);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 20px; display:flex; align-items:center; gap:8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 { margin-top: 0; font-size: 14px; color: var(--ink-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  input, textarea {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 11px 13px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    margin: 6px 0;
    outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%;
    background: var(--gold);
    color: #201400;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary { background: var(--panel-alt); color: var(--ink); border: 1px solid var(--line); }
  #status { font-size: 13px; margin-top: 8px; }
  #status.ok { color: var(--green-bright); }
  #status.err { color: var(--red); }
  .match-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .match-item span.id-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }
  #gate { text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <h1>🛠️ پنل مدیریت</h1>

  <div class="card" id="gate">
    <h3>رمز ادمین</h3>
    <input id="admin-secret" type="password" placeholder="رمز ادمین رو وارد کن">
    <button onclick="unlock()">ورود به پنل</button>
    <p id="status"></p>
  </div>

  <div id="panel" style="display:none;">

    <div class="card">
      <h3>افزودن بازی دستی</h3>
      <input id="home-team" placeholder="تیم میزبان">
      <input id="away-team" placeholder="تیم میهمان">
      <button onclick="createMatch()">➕ افزودن بازی</button>
    </div>

    <div class="card">
      <h3>دریافت بازی‌های واقعی از API</h3>
      <button class="secondary" onclick="syncMatches()">🔄 دریافت بازی‌های جدید</button>
    </div>

    <div class="card">
      <h3>بازی‌های موجود</h3>
      <div id="matches-list"></div>
    </div>

  </div>

</div>

<script>
const API = "https://football-social.onrender.com";
let adminSecret = "";

function showStatus(msg, ok) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.className = ok ? "ok" : "err";
}

async function unlock() {
  adminSecret = document.getElementById("admin-secret").value;

  const res = await fetch(`${API}/matches`);
  if (res.ok) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadMatches();
  } else {
    showStatus("خطا در اتصال به سرور", false);
  }
}

async function createMatch() {
  const home_team = document.getElementById("home-team").value;
  const away_team = document.getElementById("away-team").value;

  if (!home_team || !away_team) {
    showStatus("هر دو تیم رو وارد کن", false);
    return;
  }

  const res = await fetch(`${API}/matches?admin_secret=${encodeURIComponent(adminSecret)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ home_team, away_team })
  });

  if (!res.ok) {
    showStatus("رمز ادمین اشتباهه یا خطایی رخ داد", false);
    return;
  }

  showStatus("بازی با موفقیت اضافه شد ✅", true);
  document.getElementById("home-team").value = "";
  document.getElementById("away-team").value = "";
  loadMatches();
}

async function syncMatches() {
  const res = await fetch(`${API}/matches/sync?admin_secret=${encodeURIComponent(adminSecret)}`, {
    method: "POST"
  });

  if (!res.ok) {
    showStatus("رمز ادمین اشتباهه یا خطایی رخ داد", false);
    return;
  }

  const data = await res.json();
  showStatus(`${data.added} بازی جدید اضافه شد ✅`, true);
  loadMatches();
}

async function loadMatches() {
  const res = await fetch(`${API}/matches`);
  const matches = await res.json();

  const container = document.getElementById("matches-list");
  container.innerHTML = "";

  if (matches.length === 0) {
    container.innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">هیچ بازی‌ای وجود نداره.</p>`;
    return;
  }

  matches.forEach(m => {
    const div = document.createElement("div");
    div.className = "match-item";
    div.innerHTML = `
      <span>${m.home_team} vs ${m.away_team}</span>
      <span class="id-tag">#${m.id}</span>
    `;
    container.appendChild(div);
  });
}
</script>
</body>
</html>
